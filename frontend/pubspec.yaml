name: dbpilot
version: 0.1.0+4
description: Mobile database utility for SQL Server, Oracle and PostgreSQL
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.3
  http: ^1.2.1
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.2
  share_plus: ^10.1.4
  speech_to_text: ^7.4.0
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  google_sign_in: ^7.2.0
  in_app_purchase: ^3.3.0
  url_launcher: ^6.3.2
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
      - assets/icons/
      - assets/providers/
      - assets/images/
      - assets/illustrations/
      - assets/logos/
    
flutter_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: "#081224"
  adaptive_icon_foreground: assets/icons/app_icon.png
